version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - errorlint
    - copyloopvar
    - intrange
    - usestdlibvars
    - nilnesserr
    - fatcontext
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
