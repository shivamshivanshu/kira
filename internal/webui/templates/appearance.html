{{define "appearance-controls"}}
<div class="appearance-controls" role="group" aria-label="Display preferences">
  <label for="theme-preference">Theme
    <select id="theme-preference">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <label for="density-preference">Spacing
    <select id="density-preference">
      <option value="comfortable">Comfortable</option>
      <option value="compact">Compact</option>
    </select>
  </label>
</div>
{{end}}
