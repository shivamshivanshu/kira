{{define "datalists"}}
{{if .Config}}
<datalist id="people">{{range .Config.People.Known}}<option value="{{.Name}}">{{end}}</datalist>
<datalist id="priorities">{{range .Priorities}}<option value="{{.}}">{{end}}</datalist>
<datalist id="subtypes">{{range .Subtypes}}<option value="{{.}}">{{end}}</datalist>
<datalist id="resolutions">{{range .Resolutions}}<option value="{{.}}">{{end}}</datalist>
{{end}}
<datalist id="epics">{{range .AllItems}}{{if isContainer .Type}}<option value="{{.Number}}">{{.Title}}</option>{{end}}{{end}}</datalist>
<datalist id="sprints">{{range .Sprints}}<option value="{{.Key}}">{{.Name}}</option>{{end}}</datalist>
{{end}}
