{{define "datalists"}}
{{if .Config}}
<datalist id="people">{{range .Config.People.Known}}<option value="{{.Name}}">{{end}}</datalist>
<datalist id="priorities">{{range .Config.Priorities.Values}}<option value="{{.}}">{{end}}</datalist>
<datalist id="subtypes">{{range .Config.Subtypes.Values}}<option value="{{.}}">{{end}}</datalist>
<datalist id="resolutions">{{range .Config.Resolutions.Values}}<option value="{{.}}">{{end}}</datalist>
{{end}}
<datalist id="epics">{{range .AllItems}}{{if eq .Type "epic"}}<option value="{{.Number}}">{{.Title}}</option>{{end}}{{end}}</datalist>
<datalist id="sprints">{{range .Sprints}}<option value="{{.Key}}">{{.Name}}</option>{{end}}</datalist>
{{end}}
