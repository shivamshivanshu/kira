version: 2

project:
  key: KIRA
  name: kira

id:
  style: sequential          # sequential (default, reconciled post-merge) | hash (ULID-derived, zero reconciliation)

labels:
  known: [captured, core, tui, cli, data, infra, dx]   # 'captured' is system; the rest are retired area labels still on older items
  strict: false

people:
  known: [{ name: shivam }]   # add known people; strict rejects unknown assignees
  strict: false

commit:
  mode: auto                  # auto | manual
  subject_prefix: ""
  trailer: Kira-Ticket        # trailer key that links a commit to its ticket
  close_trailer: Kira-Closes  # trailer key that closes a ticket when the commit lands
  link_markers: [trailer, subject, leading_number]  # what links a commit: trailer, a [[KIRA-n]] subject marker, and/or a bare KIRA-n leading the subject
  reference_markers: [bare]   # what weakly references a commit: bare KIRA-n refs; [] to disable

merge:
  policy: auto                # auto | manual: auto-resolve same-field kira conflicts vs leave markers

sync:
  push: false                 # true = kira sync publishes after a clean pull; default is pull-only

ui:
  icons: auto                 # auto | nerd | emoji | text — if glyphs render as boxes, set emoji or text (nerd font not installed)
  list:
    columns: [number, state, type, subtype, priority, title]

estimate:
  unit: points                # points | hours

# filters: named saved queries, run via kira list --filter <name>.
filters:
  backlog: "state = TODO ORDER BY priority"
  core: "label = core AND state != DONE"
  next: "state = TODO AND NOT blocked ORDER BY priority"

sprints:
  - { key: 2026-S14, name: Parity + restructure, start: "2026-07-13", end: "2026-07-20" }

boards:
  - { key: KIRA, name: kira, default: true }
  - { key: CORE, name: Core store and domain }
  - { key: TUI, name: Terminal UI }
  - { key: CLI, name: Command surface }
  - { key: DATA, name: Index query and schema }
  - { key: INFRA, name: CI CD and build }
  - { key: DX, name: Tooling and hygiene }
